# Прод (E10-01, ADR-081): одна команда поднимает всё —
#   docker compose -f compose.prod.yaml up -d --build
# Отличия от локального compose.yaml: код и статика — в образе (цель prod), а не
# с диска; gunicorn за Caddy с HTTPS; данные — только в именованных томах;
# после перезагрузки сервера Docker поднимает всё сам; лимиты памяти; журналы
# контейнеров не растут без конца. Тестовая копия в локальной версии — тот же
# файл со своим именем проекта и файлом окружения (README, «Прод»).

# Имя проекта — тома называются seo_pgdata, seo_uploads…: на них ссылаются пульт
# (deploy/seo) и инструкция восстановления. Тестовая копия задаёт своё (-p).
name: seo

# Архив базы в B2 (WAL-G, ADR-081): им пишет сама база (archive_command) и
# пользуется контейнер backup. Ключи — из .env сервера.
x-walg-env: &walg-env
  WALG_S3_PREFIX: s3://${B2_BUCKET:-}/wal-g
  AWS_ENDPOINT: ${B2_ENDPOINT:-}
  AWS_REGION: ${B2_REGION:-}
  AWS_ACCESS_KEY_ID: ${B2_KEY_ID:-}
  AWS_SECRET_ACCESS_KEY: ${B2_APPLICATION_KEY:-}
  AWS_S3_FORCE_PATH_STYLE: "true"
  WALG_LIBSODIUM_KEY: ${BACKUP_WALG_KEY:-}
  WALG_LIBSODIUM_KEY_TRANSFORM: hex
  WALG_COMPRESSION_METHOD: zstd
  # Хранилище недоступно — WAL-G сдаётся после трёх попыток, и неудача видна в
  # pg_stat_archiver за минуты (проверка здоровья пишет в GlitchTip). Отправку
  # повторяет сама база раз в минуту: файл ждёт на диске, ничего не теряется.
  WALG_S3_MAX_RETRIES: "3"

# Общее у приложения, воркера и beat: один образ, те же переменные.
x-app: &app
  build:
    context: .
    target: prod
  image: seo-system-prod:${APP_VERSION:-latest}
  # Файл окружения сервера; тестовая копия передаёт свой.
  env_file: ${ENV_FILE:-.env}
  restart: unless-stopped
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    # Загруженные файлы продавцов и каталога (ADR-044): их разбирает воркер.
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M

  # Выполняет задачи очереди (ADR-039). Начатые задачи дорабатывают при
  # остановке; не успели — выполнятся снова (acks_late).
  worker:
    <<: *app
    command: celery -A config worker --concurrency=2
    volumes:
      - uploads:/app/uploads
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          memory: 2G

  # Будильник: ровно один, иначе задачи по расписанию уходили бы дважды.
  # Состояние — на томе: пропущенный запуск догоняется и после пересоздания.
  beat:
    <<: *app
    command: celery -A config beat --schedule=/var/lib/celery/beat-schedule
    volumes:
      - beat:/var/lib/celery
    deploy:
      resources:
        limits:
          memory: 256M

  # Postgres 16 с WAL-G и инструментами бэкапа (deploy/postgres/Dockerfile).
  postgres:
    build:
      context: ./deploy
      dockerfile: postgres/Dockerfile
    # Имя образа — постоянное: выкладка новой версии приложения базу не
    # перезапускает; образ меняется только вместе с deploy/postgres.
    image: seo-system-postgres:latest
    restart: unless-stopped
    logging: *logging
    environment:
      <<: *walg-env
      POSTGRES_DB: ${POSTGRES_DB:?задайте POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?задайте POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
    # Память под сервер с 8 ГБ: кеш базы — 1 ГБ, остальное читает с диска ОС.
    # Архив (PG_ARCHIVE_MODE=on): каждое изменение базы не позже чем через
    # минуту уходит в B2. Не ушло — файл журнала ждёт на диске, ничего не теряется,
    # а проверка здоровья пишет в GlitchTip.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - effective_cache_size=4GB
      - -c
      - work_mem=16MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - archive_mode=${PG_ARCHIVE_MODE:-off}
      - -c
      - archive_command=/usr/local/bin/wal-g wal-push %p
      - -c
      - archive_timeout=60
    # Параллельные запросы держат данные в /dev/shm; штатных 64 МБ Docker мало.
    shm_size: 1g
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 3G

  # Бэкапы (E10-03, ADR-081; deploy/backup/): полный снимок базы, ночной дамп и
  # файлы загрузок в B2 и, если включено (BACKUP_R2_ENABLED), в R2, еженедельная
  # проверка восстановления во временные базы; каждая — строка «Служебное → Бэкапы». Файлы живой базы и загрузок —
  # только для чтения. Первый запуск сервера — всё сразу, дальше по расписанию.
  backup:
    image: seo-system-postgres:latest
    restart: unless-stopped
    logging: *logging
    user: postgres
    entrypoint: ["/usr/local/lib/seo-backup/entrypoint.sh"]
    environment:
      <<: *walg-env
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:?задайте POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?задайте POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD}
      TZ: ${TIME_ZONE:-Europe/Moscow}
      B2_ENDPOINT: ${B2_ENDPOINT:-}
      B2_REGION: ${B2_REGION:-}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
      BACKUP_R2_ENABLED: ${BACKUP_R2_ENABLED:-false}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      BACKUP_FILES_PASSWORD: ${BACKUP_FILES_PASSWORD:-}
      # Чистить копии старше стольких дней — только для хранилища на самом
      # сервере (storage ниже); у Backblaze это делает правило корзины.
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-}
    volumes:
      - pgdata:/var/lib/postgresql/data:ro
      - uploads:/uploads:ro
      - backup_scratch:/scratch
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

  # Хранилище копий на самом сервере — пока нет Backblaze B2 (ADR-081, уточнение
  # 14.11.2026): то же «S3», что на тестовой копии, — rclone раздаёт папку тома.
  # Включается профилем: COMPOSE_PROFILES=local-backup и B2_ENDPOINT=http://storage:9000
  # в .env (docs/18-SERVER-SETUP.md §11). Наружу не смотрит. От потери самого
  # сервера не спасает — копию забирать к себе.
  storage:
    image: seo-system-postgres:latest
    profiles: ["local-backup"]
    restart: unless-stopped
    logging: *logging
    user: postgres
    entrypoint: ["sh", "-c"]
    command:
      - mkdir -p "/s3data/$$B2_BUCKET"
        && exec rclone serve s3 --addr :9000 --auth-key "$$B2_KEY_ID,$$B2_APPLICATION_KEY" /s3data
    environment:
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
    volumes:
      - backup_storage:/s3data
    deploy:
      resources:
        limits:
          memory: 512M

  # Очередь и кеш. Журнал AOF на томе: очередь переживает перезапуск.
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: unless-stopped
    logging: *logging
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M

  # HTTPS и вход снаружи: сертификат получает и продлевает сам (deploy/Caddyfile).
  # Наружу открыт только он; приложение, база и Redis — во внутренней сети.
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging: *logging
    ports:
      - "${HTTP_BIND:-80}:80"
      - "${HTTPS_BIND:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?задайте SITE_ADDRESS — домен системы}
      # Секретный путь системы (ADR-081); без него приложение не стартует само.
      SITE_PATH: ${SITE_PATH:-}
      # Сертификат: auto — домен, ip — Let's Encrypt на IP (deploy/Caddyfile).
      TLS_MODE: ${TLS_MODE:-auto}
    volumes:
      # z — метка SELinux (AlmaLinux): иначе Caddy не прочитает файл с диска.
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  pgdata:
  redisdata:
  uploads:
  beat:
  backup_scratch:
  backup_storage:
  caddy_data:
  caddy_config:
