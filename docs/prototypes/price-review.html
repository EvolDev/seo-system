    rows: state.review ? state.review.rows.map(r => r.decided) : null

}
function restore(snap) {
  for (const x of snap.sites) { const s = sites.get(x.d); s.wk = x.wk; s.pending = new Set(x.pending); s.notes = x.notes; }
  if (snap.rows && state.review) state.review.rows.forEach((r, i) => { r.decided = snap.rows[i]; });
}

// ---------- Разбор файла ----------
function normDomain(v) {
  if (!v) return '';
  let s = String(v).trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').split('/')[0];
  return /^[a-z0-9.-]+\.[a-z]{2,}$/.test(s) ? s : '';
}
function parsePrice(v) {
  if (v == null || v === '') return null;
  const s = String(v).replace(/[$€\s  ]/g, '').replace(',', '.');
  return /^\d+(\.\d+)?$/.test(s) ? Number(s) : NaN;
}
function classify(site, t, p) {
  if (!site) return 'new';
  if (site.status === 'Отклонена') return 'rejected';
  const wk = workingOf(site);
  if (!wk) return 'new';
  if (wk.t !== t) return 'other';
  const d = delta({p, cur: 'USD', s: 'lh', t}, wk);
  if (Math.abs(d.v) < 0.5) return 'same';
  if (wk.s === 'lh') return 'changed';
  return d.v < 0 ? 'cheaper' : 'pricier';
}
function planImport(map) {
  const idx = f => FILE.headers.findIndex(h => map[h] === f);
  const iDom = idx('domain'), iGp = idx('gp'), iLi = idx('li'), iGrey = idx('grey'), iDr = idx('dr'), iTr = idx('traffic');
  const extraCols = FILE.headers.map((h, i) => [h, i]).filter(([h]) => map[h] === 'extra' || map[h] === 'linktype');
  const errors = [], byDomain = new Map();
  FILE.rows.forEach((row, n) => {
    const line = n + 2, raw = row[iDom], domain = normDomain(raw);
    const gp = iGp >= 0 ? parsePrice(row[iGp]) : null, li = iLi >= 0 ? parsePrice(row[iLi]) : null;
    if (!domain) { errors.push({line, msg: `нет площадки${raw ? ` («${raw}»)` : ''}${Number.isNaN(gp) ? `, цена «${row[iGp]}» не распознана` : ''} — строка пропущена`}); return; }
    if (Number.isNaN(gp) || Number.isNaN(li)) { errors.push({line, msg: `${domain}: цена не распознана — строка пропущена`}); return; }
    const extra = {};
    for (const [h, i] of extraCols) if (row[i] !== '' && row[i] != null) extra[h] = row[i];
    const rec = {line, domain, raw: String(raw), gp, li, grey: iGrey >= 0 ? parsePrice(row[iGrey]) : null,
      dr: iDr >= 0 ? Number(row[iDr]) : null, traffic: iTr >= 0 ? Number(String(row[iTr]).replace(/\s/g, '')) : null, extra};
    if (!byDomain.has(domain)) byDomain.set(domain, []);
    byDomain.get(domain).push(rec);
  });
  const dups = [], rows = [];
  for (const [domain, recs] of byDomain) {
    const pick = f => { const v = recs.map(r => r[f]).filter(x => x != null); return v.length ? Math.min(...v) : null; };
    const rec = {...recs[0], gp: pick('gp'), li: pick('li'), grey: pick('grey')};
    if (recs.length > 1) dups.push({domain, lines: recs.map(r => r.line), prices: recs.map(r => r.gp).filter(x => x != null), used: rec.gp});
    const site = sites.get(domain) || null;
    for (const t of ['GP', 'LI']) {
      const p = t === 'GP' ? rec.gp : rec.li;
      if (p == null) continue;
      const wk = site ? workingOf(site) : null;
      rows.push({id: rows.length + 1, domain, t, p, grey: t === 'GP' ? rec.grey : null, extra: rec.extra,
        isNew: !site, url: rec.raw !== domain ? rec.raw : null, dr: rec.dr, traffic: rec.traffic,
        cat: classify(site, t, p), refId: wk ? wk.id : null, hasGp: rec.gp != null, decided: null, offerId: null});
    }
  }
  return {rows, dups, errors, sites: byDomain.size, known: [...byDomain.keys()].filter(d => sites.has(d)).length};
}
function applyImport(plan) {
  const list = `${sellerName('lh')} · ${TODAY}`;
  for (const r of plan.rows) {
    let site = sites.get(r.domain);
    if (!site) {
      site = S(r.domain, r.dr, r.traffic, 'Новая', null, [], null, [], 'lh');
      site.lists = new Set();
      sites.set(r.domain, site);
    }
    site.lists.add(list);
    if (!site.metrics.some(m => m.src === 'lh' && m.d === TODAY)) site.metrics.push({d: TODAY, src: 'lh', dr: r.dr, traffic: r.traffic});
    const o = O('lh', r.t, r.p, TODAY, {g: r.grey, extra: Object.keys(r.extra).length ? r.extra : null});
    site.offers.push(o);
    r.offerId = o.id;
    if (r.cat === 'new') {
      if (!site.wk && (r.t === 'GP' || !r.hasGp)) {
        site.wk = o.id;
        r.auto = true;
        site.notes.unshift(N(USER, TODAY, `Цена: рабочей стала ${offerLabel(o)} — первая цена площадки`));
      }
    } else if (DECIDE.has(r.cat)) {
      site.pending.add(o.id);
    }
  }
  imports.unshift({id: 'new', title: FILE.name, seller: 'lh', kind: 'Прайс продавца', date: TODAY, rows: FILE.rows.length, list, done: 0, total: plan.rows.filter(r => DECIDE.has(r.cat)).length});
  state.review = {rows: plan.rows, dups: plan.dups, errors: plan.errors, list, tab: 'cheaper', hideDone: true, sort: 'gain', focus: 0, open: new Set(), sel: new Set()};
  state.list.list = 'all';
}

function visibleRows() {
  const rv = state.review;
  if (rv.tab === 'issues') return [];
  let rows = rv.rows.filter(r => r.cat === rv.tab && !(rv.hideDone && r.decided));
  const d = r => { const s = sites.get(r.domain), ref = s.offers.find(o => o.id === r.refId), o = s.offers.find(x => x.id === r.offerId); const x = r.cat === 'other' ? null : delta(o, ref); return x ? toEur(x.v, x.cur) : 1e9; };
  if (rv.sort === 'gain') rows = rows.slice().sort((a, b) => d(a) - d(b));
  else rows = rows.slice().sort((a, b) => (drOf(sites.get(b.domain)) || 0) - (drOf(sites.get(a.domain)) || 0));
  return rows;
}

function cheaperOf(site) {

}
function newPriceOf(site) {

  const others = currentOffers(site).length - (wk ? 1 : 0);
  if (!parts.length && others > 0) parts.push(`<span class="muted">ещё ${others}</span>`);
  if (!wk && site.offers.length === 0) parts.push('<span class="chip warn">нет цены</span>');

}
function filteredSites() {

    if (f.list !== 'all' && !s.lists.has(f.list)) return false;
    if (f.offers === 'pending' && !s.pending.size) return false;
    if (f.offers === 'cheaper' && !cheaperOf(s)) return false;
    if (f.offers === 'noprice' && workingOf(s)) return false;
    if (f.seller !== 'all' && !s.offers.some(o => o.s === f.seller)) return false;

}

function applyListAction() {
  const f = state.list, domains = [...f.sel], snap = snapshot(domains);
  let changed = 0, skipped = 0;
  for (const d of domains) {
    const s = sites.get(d), wk = workingOf(s);
    if (f.action === 'accept') {
      const np = newPriceOf(s);

      const cur = currentOffers(s).filter(o => o.s === f.actSeller);

    } else {

  f.sel.clear();

}

    <section><h3>Заметки</h3>
      <div class="form"><textarea id="note-text" rows="2" placeholder="Новая заметка" aria-label="Текст заметки"></textarea>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><select id="note-product" aria-label="Продукт"><option value="">Без продукта</option><option>Convertio</option><option>Clideo</option></select><button type="button" class="btn primary" data-act="add-note" data-domain="${esc(site.domain)}">Добавить заметку</button></div></div>
      <ul class="notes" style="margin-top:12px">${notes || '<li class="muted">Заметок нет</li>'}</ul>
      <p class="hint">Заметки не правятся и не удаляются: это история. Смена рабочей цены и отказ попадают сюда сами.</p></section>`;
}

// ---------- Общая отрисовка ----------
function render() {
  $('nav').innerHTML = navHtml();
  $('crumbs').innerHTML = crumbsHtml();
  const views = {imports: importsHtml, wizard: wizardHtml, review: reviewHtml, sites: sitesHtml, sellers: sellersHtml};
  $('main').innerHTML = views[state.route]();
  renderDrawer();
}
function renderDrawer() {
  const open = !!state.drawer;
  $('drawer').hidden = !open; $('back').hidden = !open;
  if (open) $('drawer').innerHTML = drawerHtml(sites.get(state.drawer));
}
let toastTimer = null;
function toast(text, snap) {
  const t = $('toast');
  t.innerHTML = `<span>${esc(text)}</span>${snap ? '<button type="button" data-act="undo">Отменить</button>' : ''}`;
  t.hidden = false;
  state.toast = snap || null;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; state.toast = null; }, 7000);
}
function go(route) { closePop(); state.route = route; state.drawer = null; window.scrollTo(0, 0); render(); }

// ---------- Решения в разборе ----------
function rowById(id) { return state.review.rows.find(r => r.id === Number(id)); }
function decideRows(rows, how) {
  rows = rows.filter(r => !r.decided && DECIDE.has(r.cat));
  if (!rows.length) return;
  const snap = snapshot([...new Set(rows.map(r => r.domain))]);
  for (const r of rows) {
    const s = sites.get(r.domain);
    if (how === 'fix') fixOffer(s, r.offerId);
    else { s.pending.delete(r.offerId); r.decided = 'kept'; }
    syncRows(s);
    state.review.sel.delete(r.id);
  }
  const one = rows.length === 1 ? rows[0] : null;
  toast(how === 'fix'
    ? (one ? `${one.domain}: рабочая — ${sellerName('lh')} ${money(one.p, 'USD')}` : `Рабочая цена изменена у ${rows.length} строк`)
    : (one ? `${one.domain}: оставлена прежняя цена` : `Оставлено как есть: ${rows.length}`), snap);
}

// ---------- События ----------
document.addEventListener('click', e => {
  if (!pop.hidden && !e.target.closest('#pop') && !e.target.closest('[data-act="chart"]')) closePop();
  const el = e.target.closest('[data-route],[data-act]');
  if (!el) {
    if (e.target === $('back')) { state.drawer = null; renderDrawer(); }
    return;
  }
  if (el.dataset.route) { go(el.dataset.route); return; }
  const act = el.dataset.act, rv = state.review;
  switch (act) {
    case 'chart': openChart(el); break;
    case 'close-pop': closePop(); break;
    case 'hide-tips': state.tipsHidden = true; render(); break;
    case 'start-import': state.w = newWizard(); go('wizard'); break;
    case 'w-sample': state.w.file = FILE.name; state.w.error = null; render(); break;
    case 'w-clear': state.w.file = null; render(); break;
    case 'w-back': state.w.step -= 1; state.w.error = null; render(); break;
    case 'w-next': {
      const w = state.w;
      if (w.step === 1) {
        if (!w.file) { w.error = 'Выберите файл или возьмите пример.'; render(); break; }
        w.error = null; w.step = 2;
      } else if (w.step === 2) {
        const vals = Object.values(w.mapping);
        if (!vals.includes('domain')) { w.error = 'Укажите, в какой колонке площадка.'; render(); break; }
        if (!vals.includes('gp') && !vals.includes('li')) { w.error = 'Укажите хотя бы одну цену: публикации или вставки ссылки.'; render(); break; }
        w.error = null; w.plan = planImport(w.mapping); w.step = 3;
      }
      window.scrollTo(0, 0); render(); break;
    }
    case 'w-write': {
      const w = state.w;
      w.busy = 'Задача в очереди…'; render();
      setTimeout(() => { w.busy = `Записываю: ${w.plan.sites} площадок, ${w.plan.rows.length} цен…`; render(); }, 600);
      setTimeout(() => { applyImport(w.plan); state.w = null; go('review'); toast('Загрузка записана. Можно разбирать.'); }, 1400);
      break;
    }
    case 'tab': rv.tab = el.dataset.tab; rv.focus = 0; render(); break;
    case 'fix-row': decideRows([rowById(el.dataset.row)], 'fix'); render(); break;
    case 'keep-row': decideRows([rowById(el.dataset.row)], 'keep'); render(); break;
    case 'toggle-row': { const id = Number(el.dataset.row); rv.open.has(id) ? rv.open.delete(id) : rv.open.add(id); render(); break; }
    case 'bulk-fix': decideRows(rv.rows.filter(r => rv.sel.has(r.id)), 'fix'); render(); break;
    case 'bulk-keep': decideRows(rv.rows.filter(r => rv.sel.has(r.id)), 'keep'); render(); break;
    case 'bulk-clear': rv.sel.clear(); render(); break;
    case 'open-site': state.drawer = el.dataset.domain; renderDrawer(); $('drawer').focus(); break;
    case 'close-drawer': state.drawer = null; renderDrawer(); break;
    case 'fix': {
      const s = sites.get(el.dataset.domain), snap = snapshot([s.domain]);
      if (fixOffer(s, Number(el.dataset.offer))) { syncRows(s); toast(`${s.domain}: рабочая цена — ${offerLabel(workingOf(s))}`, snap); }
      render(); break;
    }
    case 'add-note': {
      const text = $('note-text').value.trim();
      if (!text) { $('note-text').focus(); break; }
      sites.get(el.dataset.domain).notes.unshift(N(USER, TODAY, text, $('note-product').value));
      render(); toast('Заметка добавлена'); break;
    }
    case 'apply-action': applyListAction(); render(); break;
    case 'undo': if (state.toast) { restore(state.toast); $('toast').hidden = true; state.toast = null; render(); } break;
  }
});
document.addEventListener('change', e => {
  const t = e.target, w = state.w, rv = state.review, f = state.list;
  if (t.id === 'w-seller' && w) { w.seller = t.value === 'add' ? 'lh' : t.value; render(); }
  else if (t.id === 'w-date' && w) w.date = t.value;
  else if (t.id === 'w-file' && w && t.files && t.files[0]) { w.file = t.files[0].name; w.error = null; render(); }
  else if (t.dataset.map && w) { w.mapping[t.dataset.map] = t.value; w.touched.add(t.dataset.map); render(); }
  else if (t.dataset.selRow && rv) { const id = Number(t.dataset.selRow); t.checked ? rv.sel.add(id) : rv.sel.delete(id); render(); }
  else if (t.id === 'sel-all' && rv) { visibleRows().filter(r => !r.decided).forEach(r => t.checked ? rv.sel.add(r.id) : rv.sel.delete(r.id)); render(); }
  else if (t.id === 'rv-sort' && rv) { rv.sort = t.value; render(); }
  else if (t.id === 'rv-hide' && rv) { rv.hideDone = t.checked; render(); }
  else if (t.dataset.selSite) { t.checked ? f.sel.add(t.dataset.selSite) : f.sel.delete(t.dataset.selSite); render(); }
  else if (t.id === 'sel-all-sites') { filteredSites().forEach(s => t.checked ? f.sel.add(s.domain) : f.sel.delete(s.domain)); render(); }
  else if (t.id === 'act') { f.action = t.value; render(); }
  else if (t.dataset.trust) { SELLERS[t.dataset.trust].trusted = t.checked; render(); toast(`${sellerName(t.dataset.trust)}: метрикам ${t.checked ? 'доверяем' : 'не доверяем'}`); }
  else if (t.id === 'act-seller') f.actSeller = t.value;
  else if (['f-list', 'f-offers', 'f-seller', 'f-notes'].includes(t.id)) { f[t.id.slice(2)] = t.value; f.sel.clear(); f.msg = null; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') {
    state.list.q = e.target.value;
    const pos = e.target.selectionStart; render();
    const q = $('q'); q.focus(); q.setSelectionRange(pos, pos);
  }
});
document.addEventListener('keydown', e => {
  if (!pop.hidden && e.key === 'Escape') { closePop(); return; }
  if (state.drawer) { if (e.key === 'Escape') { state.drawer = null; renderDrawer(); } return; }
  if (state.route !== 'review' || e.target.closest('input,textarea,select') || e.ctrlKey || e.metaKey || e.altKey) return;
  const rv = state.review, rows = visibleRows();
  if (!rows.length) return;
  const r = rows[rv.focus];
  const k = e.key.toLowerCase();
  if (k === 'j' || k === 'arrowdown' || k === 'о') rv.focus = Math.min(rows.length - 1, rv.focus + 1);
  else if (k === 'k' || k === 'arrowup' || k === 'л') rv.focus = Math.max(0, rv.focus - 1);
  else if ((k === 'a' || k === 'ф') && DECIDE.has(r.cat)) decideRows([r], 'fix');
  else if ((k === 's' || k === 'ы') && DECIDE.has(r.cat)) decideRows([r], 'keep');
  else if ((k === 'x' || k === 'ч') && DECIDE.has(r.cat) && !r.decided) { rv.sel.has(r.id) ? rv.sel.delete(r.id) : rv.sel.add(r.id); }
  else if (k === 'o' || k === 'щ' || k === 'enter') { rv.open.has(r.id) ? rv.open.delete(r.id) : rv.open.add(r.id); }
  else return;
  e.preventDefault();
  render();
  const tr = document.querySelector(`tr[data-ri="${rv.focus}"]`);
  if (tr) tr.scrollIntoView({block: 'nearest'});
});

// График во всплывающем окне у значка.
const pop = $('pop');
function openChart(btn) {
  const site = sites.get(btn.dataset.domain), series = chartSeries(site, btn.dataset.kind);
  pop.innerHTML = `<div class="pop-head"><div><b>${esc(series.title)}</b><div class="sub">${esc(site.domain)}</div></div><button type="button" class="btn small" data-act="close-pop" aria-label="Закрыть">✕</button></div>${chartHtml(series, 372)}<p class="hint">${esc(series.note)}</p>`;
  pop.hidden = false;
  const r = btn.getBoundingClientRect(), pw = pop.offsetWidth, ph = pop.offsetHeight;
  let x = Math.min(window.innerWidth - pw - 8, Math.max(8, r.left - 20)), y = r.bottom + 8;
  if (y + ph > window.innerHeight - 8) y = Math.max(8, r.top - ph - 8);
  pop.style.left = x + 'px'; pop.style.top = y + 'px';
}
function closePop() { pop.hidden = true; }
document.addEventListener('pointermove', e => {
  const box = e.target.closest && e.target.closest('.chart');
  document.querySelectorAll('.chart.on').forEach(c => { if (c !== box) hideCross(c); });
  if (!box) return;
  const data = charts.get(box.dataset.chart), svg = box.querySelector('svg');
  if (!data || !svg) return;
  const rect = svg.getBoundingClientRect(), k = data.w / rect.width, mx = (e.clientX - rect.left) * k;
  let i = 0;
  data.xs.forEach((x, j) => { if (Math.abs(x - mx) < Math.abs(data.xs[i] - mx)) i = j; });
  const xh = svg.querySelector('.xh'), hd = svg.querySelector('.hd'), tipEl = box.querySelector('.ctip');
  xh.setAttribute('x1', data.xs[i]); xh.setAttribute('x2', data.xs[i]); xh.setAttribute('visibility', 'visible');
  hd.setAttribute('cx', data.xs[i]); hd.setAttribute('cy', data.ys[i]); hd.setAttribute('visibility', 'visible');
  const p = data.pts[i];
  tipEl.textContent = '';
  const b = document.createElement('b'); b.textContent = data.fmt(p.v);
  tipEl.append(b, document.createTextNode(` · ${p.d}${p.src ? ' · ' + srcName(p.src) : ''}`));
  tipEl.hidden = false;
  const left = Math.min(rect.width - tipEl.offsetWidth / 2, Math.max(tipEl.offsetWidth / 2, data.xs[i] / k));
  tipEl.style.left = left + 'px'; tipEl.style.top = '-26px';
  box.classList.add('on');
});
function hideCross(box) {
  box.classList.remove('on');
  const svg = box.querySelector('svg');
  if (svg) { svg.querySelector('.xh').setAttribute('visibility', 'hidden'); svg.querySelector('.hd').setAttribute('visibility', 'hidden'); }
  const t = box.querySelector('.ctip'); if (t) t.hidden = true;
}

// Подсказки при наведении: одна плашка на страницу, не обрезается таблицей.
const tip = $('tip');
document.addEventListener('mouseover', e => {
  const el = e.target.closest('[data-tipt]');
  if (!el) { tip.hidden = true; return; }
  tip.textContent = el.dataset.tipt;
  tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(window.innerWidth - tw - 8, Math.max(8, r.left));
  let y = r.bottom + 6;
  if (y + th > window.innerHeight - 8) y = r.top - th - 6;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
});
document.addEventListener('scroll', () => { tip.hidden = true; }, true);

render();
})();
</script>
