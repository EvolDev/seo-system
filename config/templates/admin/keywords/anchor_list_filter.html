{% comment %}
Фильтр «Список анкоров» на странице «Анкоры» (ADR-075): регионы продукта с
флагами (seo/country-picker.js поверх <select>), как фильтр «Регион» в
«Площадках». Выбор открывает адрес без перезагрузки страницы (seo/soft-nav.js).
{% endcomment %}
<div class="list-filter-dropdown seo-region-filter">
    <h3 class="active">{{ title|capfirst }}</h3>
    {% if choices %}
    <div class="seo-country" data-country-picker data-navigate data-auto data-label="Список анкоров" data-placeholder="США, Бразилия…">
        <select>
        {% for choice in choices %}
            <option {% if choice.selected %}selected{% endif %} value="{{ choice.query_string|iriencode }}"{% if choice.flag %} data-flag="{{ choice.flag }}"{% endif %}>{{ choice.display }}</option>
        {% endfor %}
        </select>
    </div>
    {% else %}
    <p class="seo-sub">Списков нет — загрузите файл анкоров.</p>
    {% endif %}
</div>
