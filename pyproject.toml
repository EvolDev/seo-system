[project]
name = "seo-system"
version = "0.1.0"
description = "SEO-система линкбилдинга convertio.co"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6",
    "psycopg[binary]>=3.2",
    "python-json-logger>=4.2.0",
    "sentry-sdk[django]>=2.70.0",
]

[tool.uv]
# Приложение, а не библиотека: пакет не собирается и не публикуется.
package = false
# docs ставится по умолчанию: проверка и сборка документации идут в
# контейнере (make docs-check, pre-commit), а в E9-07 сайт собирается в образе.
default-groups = ["dev", "docs"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["source", "site"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # порядок импортов
    "B",   # bugbear: типичные ошибки
    "UP",  # современный синтаксис Python
    "SIM", # упрощения
    "DJ",  # правила для Django
    "RUF", # правила самого ruff
]
ignore = [
    # «Похожие символы»: кириллица в строках и комментариях — норма для проекта.
    "RUF001",
    "RUF002",
    "RUF003",
    # null=True у текстовых полей: в schema.sql текстовые колонки допускают NULL,
    # «нет данных» и пустая строка различаются (ADR-029).
    "DJ001",
]

[tool.ruff.lint.per-file-ignores]
# Миграции генерирует Django: длинные строки verbose_name не переносятся,
# списки dependencies и operations — атрибуты класса по его соглашению.
"*/migrations/*" = ["E501", "RUF012"]

[tool.ruff.format]
# ruff умеет форматировать блоки кода в Markdown; документацию не трогаем.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["^source/", "^site/", "^\\.venv/"]

[tool.django-stubs]
django_settings_module = "config.settings.local"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
addopts = "--strict-markers"
norecursedirs = [".*", "source", "docs", "user-docs", "site", "screens", "tools"]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.9",
    "types-pyyaml>=6.0.12.20260906",
]
# Сборка пользовательской документации — docs/15-USER-DOCS.md §6.
# Проверено 23.09.2026: mkdocs 1.6.1 + mkdocs-material 9.7.7.
# MkDocs 2.0 несовместим с Material и с нашим mkdocs.yml (нет плагинов,
# другой формат конфига) — верхняя граница <2 обязательна. Запасной движок —
# zensical: собирает этот же mkdocs.yml без изменений (проверено на 0.0.64),
# переход — когда выйдет 1.0.
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.5,<10",
    "pyyaml>=6",
]
